version = "1.0"
artifacts = ["/workspace/submissions/submitted.patch"]
[metadata]
task = "rq_delete_queue_owned_state_contract"
[agent]
timeout_sec = 1800
user = "1000:1000"
[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 8192
network_mode = "no-network"
[verifier]
timeout_sec = 3600
user = "0"
environment_mode = "separate"
[verifier.environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 8192
network_mode = "no-network"
[[verifier.collect]]
command = "/opt/task-tools/python -I /opt/task-tools/capture.py"
user = "0"
timeout_sec = 900
