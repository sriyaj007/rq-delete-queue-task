services:
  main:
    # Harbor replaces the image's CMD with "sleep infinity"; start Redis first
    # so the repository's own test suite can run.
    command: ["sh", "-c", "setpriv --reuid=1000 --regid=1000 --clear-groups redis-server --daemonize yes --save '' --appendonly no --dir /tmp && exec sleep infinity"]
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
